<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maze</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0e0f13; font-family: system-ui, sans-serif; color: #e6e6e6; }
      #hud { position: fixed; top: 16px; left: 16px; display: flex; flex-direction: column; gap: 8px; max-width: 360px; }
      button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid #3a3f4b; background: #1c1f27; color: inherit; cursor: pointer; }
      button:hover { background: #262a35; }
      #status { font-size: 14px; opacity: 0.85; }
      #debug { font: 12px ui-monospace, monospace; white-space: pre; opacity: 0.7; }
      #secret[hidden] { display: none; }
      #secret { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: radial-gradient(ellipse at center, rgba(14,15,19,0.55), rgba(14,15,19,0.92)); opacity: 0; pointer-events: none;
        transition: opacity 0.6s ease; cursor: pointer; text-align: center; padding: 16px; }
      #secret.show { opacity: 1; pointer-events: auto; }
      #secret .whisper { font: 13px ui-monospace, monospace; letter-spacing: 0.35em; text-transform: uppercase; opacity: 0.55; }
      #secret .code { font: 600 clamp(36px, 9vw, 84px) ui-monospace, monospace; letter-spacing: 0.18em; color: #7fdcff; transition: color 0.4s; }
      #secret .code.locked { color: #f2f6ff; }
      #secret .hint { font-size: 12px; opacity: 0.35; }
    </style>
  </head>
  <body>
    <div id="hud">
      <div>
        <button id="connect">Connect Controller</button>
        <button id="calibrate">Calibrate (✕)</button>
        <button id="haptics">HD haptics (USB)</button>
      </div>
      <div id="status"></div>
      <div id="debug"></div>
    </div>
    <div id="secret" hidden>
      <div class="whisper">What goes around, comes around</div>
      <div class="code"></div>
      <div class="whisper">Enter in telegram</div>
      <div class="hint">click to continue</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
